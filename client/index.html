<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Manager</title>
</head>
<body>
  <h1>Students</h1>
  <input id="name" placeholder="Name">
  <input id="subject" placeholder="Subject">
  <button onclick="addStudent()">Add</button>

  <table border="1">
    <thead><tr><th>Name</th><th>Subject</th><th>Actions</th></tr></thead>
    <tbody id="list"></tbody>
  </table>

  <script>
    const API = 'http://localhost:3000/students';

    async function load() {
      const students = await (await fetch(API)).json();
      document.getElementById('list').innerHTML = students.map(s => `
        <tr>
          <td>${s.name}</td>
          <td>${s.subject}</td>
          <td>
            <button onclick="editStudent('${s._id}')">Edit</button>
            <button onclick="deleteStudent('${s._id}')">Delete</button>
          </td>
        </tr>`).join('');
    }

    async function addStudent() {
      const name = document.getElementById('name').value;
      const subject = document.getElementById('subject').value;
      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, subject })
      });
      load();
    }

    async function editStudent(id) {
      const name = prompt('New name:');
      const subject = prompt('New subject:');
      await fetch(`${API}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, subject })
      });
      load();
    }

    async function deleteStudent(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
      load();
    }

    load();
  </script>
</body>
</html>
