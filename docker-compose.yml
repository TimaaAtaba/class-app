services:
  db:
    image: mongo
    volumes:
      - dbdata:/data/db

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://db:27017/school
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  dbdata:
